{% extends "auth_base.html" %}

{% block title %}404 - Page Not Found | ServiceHub{% endblock %}

{% block card_content %}
<div class="py-3">
    <div class="text-primary mb-3">
        <i class="fas fa-exclamation-triangle fa-4x text-warning"></i>
    </div>
    <h1 class="display-4 text-white fw-bold mb-2">404</h1>
    <h3 class="text-white mb-3">Page Not Found</h3>
    <p class="text-secondary mb-4">
        The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
    </p>
    <div class="d-grid gap-2">
        <a href="{% url 'index' %}" class="btn btn-primary btn-lg">
            <i class="fas fa-home me-2"></i>Go to Homepage
        </a>
        <a href="{% url 'services' %}" class="btn btn-outline-secondary">
            <i class="fas fa-tools me-2"></i>Browse Services
        </a>
    </div>
</div>
{% endblock %}
